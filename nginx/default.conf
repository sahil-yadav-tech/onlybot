server {
    listen 80;
    server_name chatversebackendsahil.publicvm.com;

    return 301 https://$host$request_uri;
}

server {

    listen 443 ssl;
    http2 on;

    server_name chatversebackendsahil.publicvm.com;

    ssl_certificate /etc/letsencrypt/live/chatversebackendsahil.publicvm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chatversebackendsahil.publicvm.com/privkey.pem;

    location / {

        proxy_pass http://backend:1111;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}